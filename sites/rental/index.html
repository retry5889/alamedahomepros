<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f1e7"><meta name="robots" content="noindex,nofollow"><title>Rental property calculator</title><link rel="icon" href="./mark.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css?v=4"></head><body>
<header><a href="#" id="home">Rental property calculator</a><button id="saved">My places</button></header>
<main><div id="warning" role="alert" hidden></div><div class="property"><span id="name"></span><span id="save" role="status"></span></div><nav aria-label="Estimate steps" hidden><button data-step="0">1. Buy</button><button data-step="1">2. Set up</button><button data-step="2">3. Run</button><button data-step="3">Estimate</button></nav><div id="example" hidden>Saved example · not market data <button id="clear-example">Start fresh</button></div><section id="screen" tabindex="-1"></section><div class="navigation" hidden><button id="back">Back</button><button id="next" class="primary">Continue</button></div><button id="fine" class="text">More assumptions</button><footer>Saved on this device.</footer></main>
<dialog id="settings"><div class="dialog-heading"><h2>Fine-tune</h2><button data-close="settings" aria-label="Close assumptions">×</button></div><div id="advanced"></div></dialog>
<dialog id="places"><div class="dialog-heading"><h2>My places</h2><button data-close="places" aria-label="Close properties">×</button></div><label for="select">Saved property</label><select id="select"></select><label for="rename">Name or address</label><input id="rename" maxlength="160"><div class="actions"><button id="new" class="primary">New property</button><button id="export">Export backup</button><button id="import">Import backup</button><button id="delete">Delete property</button></div><p id="file-status" role="status"></p><input id="file" type="file" accept=".json,application/json" hidden><small>Local storage is not encrypted or synced.</small></dialog>
<noscript>Enable JavaScript to calculate locally in your browser.</noscript><script type="module" src="./app.mjs?v=4"></script></body></html>
