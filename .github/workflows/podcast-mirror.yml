name: Mirror publicly staged podcast assets
on:
  workflow_dispatch:
  schedule:
    - cron: '10,25,40,55 6,12 * * *'
      timezone: America/Los_Angeles
concurrency:
  group: podcast-public-mirror
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            a
            scripts/podcast_mirror.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests defusedxml
      - name: Copy only public finished assets using native repository authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/podcast_mirror.py
