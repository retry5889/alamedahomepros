name: Claims Card prefill (daily into release)

on:
  workflow_dispatch:
  schedule:
    - cron: '43 13 * * 1-4'  # Mon-Thu 13:43 UTC (fresh consensus/forecast daily into release week)

concurrency:
  group: card-prefill
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prefill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build data.json
        run: python3 scripts/build_card_data.py
      - name: Commit if changed
        run: |
          git config user.name "claims-card[bot]"
          git config user.email "claims-card[bot]@users.noreply.github.com"
          git add data.json docs/data.json
          git commit -m "card: weekly prefill [run ${{ github.run_id }}]" || { echo "no change"; exit 0; }
          git push
