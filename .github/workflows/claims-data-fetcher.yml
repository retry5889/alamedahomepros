name: Claims data fetcher (public runner, data committed to fetched-data branch)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: claims-data-fetcher
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout fetcher repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run all fetch scripts (collect into ./payload)
        run: |
          set -uo pipefail
          mkdir -p payload/raw
          echo "--- NWS alerts ---"
          OUTPUT_DIR=payload/raw/nws_alerts python3 scripts/fetch_nws_alerts.py || echo "nws rc=$?"
          echo "--- Historical weather (Storm Events + HURDAT2) ---"
          OUTPUT_DIR=payload/raw python3 scripts/fetch_historical_weather.py || echo "hist rc=$?"
          echo "--- WARN ---"
          OUTPUT_DIR=payload/raw/warn python3 scripts/fetch_warn.py || echo "warn rc=$?"
          echo "--- Google Trends (prospective) ---"
          OUTPUT_DIR=payload/raw/google_trends python3 scripts/fetch_google_trends.py || echo "trends rc=$?"
          echo "--- payload summary ---"
          find payload -type f | head -60
          du -sh payload || true

      - name: Commit payload to fetched-data branch
        env:
          BRANCH: fetched-data
        run: |
          set -euo pipefail
          git config --global user.name "claims-data-fetcher[bot]"
          git config --global user.email "claims-data-fetcher[bot]@users.noreply.github.com"

          git init -q /tmp/pub
          cd /tmp/pub
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code origin "$BRANCH" >/dev/null 2>&1; then
            git fetch -q origin "$BRANCH"
            git checkout -q "$BRANCH"
          else
            git checkout -q --orphan "$BRANCH"
            git rm -rfq . || true
          fi

          mkdir -p raw
          cp -r "$GITHUB_WORKSPACE/payload/raw/." raw/ 2>/dev/null || true
          git add raw/
          git commit -q -m "data: fetch [run ${{ github.run_id }}]" || { echo "no changes"; exit 0; }

          for attempt in 1 2 3 4 5 6 7 8; do
            if git push -q origin "$BRANCH"; then echo "push ok attempt $attempt"; exit 0; fi
            git fetch -q origin "$BRANCH" || true
            git rebase -q "origin/$BRANCH" || git rebase --abort || true
            sleep $(( RANDOM % 5 + 2 ))
          done
          exit 1
