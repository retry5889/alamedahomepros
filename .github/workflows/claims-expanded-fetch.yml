name: Claims expanded data fetch (FEMA, Treasury, EIA, BLS, SEC)

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run expanded fetch
        env:
          OUTPUT_DIR: payload/raw
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          python3 scripts/fetch_expanded.py
      - name: Commit payload to fetched-data branch
        env:
          BRANCH: fetched-data
        run: |
          set -euo pipefail
          git config --global user.name "claims-data-fetcher[bot]"
          git config --global user.email "claims-data-fetcher[bot]@users.noreply.github.com"
          git init -q /tmp/pub
          cd /tmp/pub
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code origin "$BRANCH" >/dev/null 2>&1; then
            git fetch -q origin "$BRANCH"; git checkout -q "$BRANCH"
          else
            git checkout -q --orphan "$BRANCH"; git rm -rfq . || true
          fi
          mkdir -p raw
          cp -r "$GITHUB_WORKSPACE/payload/raw/." raw/ 2>/dev/null || true
          git add raw/
          git commit -q -m "data: expanded fetch [run ${{ github.run_id }}]" || { echo "no changes"; exit 0; }
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push -q origin "$BRANCH"; then echo "push ok $attempt"; exit 0; fi
            git fetch -q origin "$BRANCH" || true
            git rebase -q "origin/$BRANCH" || git rebase --abort || true
            sleep $(( RANDOM % 5 + 2 ))
          done
          exit 1
